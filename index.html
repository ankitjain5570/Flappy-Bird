<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Without this, mobile browsers lay out at ~980px and scale the whole game down. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#172b3d" />
    <meta name="description" content="Skybound Flap — an original arcade flight game for your browser." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Skybound Flap</title>

    <!-- SVG first for modern browsers; .ico is the fallback and also what
         Windows/bookmark bars and crawlers look for at the site root. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (Slack, WhatsApp, X, iMessage, Discord). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Skybound Flap" />
    <meta property="og:description" content="An original arcade flight game for your browser." />
    <meta property="og:url" content="https://flappybird-byaj.netlify.app/" />
    <meta property="og:image" content="https://flappybird-byaj.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skybound Flap" />
    <meta name="twitter:description" content="An original arcade flight game for your browser." />
    <meta name="twitter:image" content="https://flappybird-byaj.netlify.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
