name: Keep Supabase awake

# Free-tier Supabase projects pause after 7 days with no database activity.
# This queries the database daily so the project never goes idle long enough
# to trigger that. workflow_dispatch lets it be run manually to test or to
# recover immediately if a run is ever missed.
on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily — an off-the-hour time to avoid GitHub's peak-minute queue delays
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The publishable key is safe to commit: it's the same key already shipped
      # in the built client JS, and RLS on player_stats restricts every row to
      # its own authenticated owner regardless of who holds this key.
      - name: Query player_stats to register database activity
        env:
          SUPABASE_URL: https://cjzejqveikixkbrakkwx.supabase.co
          SUPABASE_KEY: sb_publishable_hDeuc2rXy675NDsf-6mokA_rbHpkZm9
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/player_stats?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::Keep-alive ping failed with HTTP $status. If the Supabase project URL or publishable key changed, update them in .github/workflows/supabase-keepalive.yml."
            exit 1
          fi
